<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">同样未完攀，记录能留下不同的进步</title><desc id="d">三次尝试结果都是未完攀，语音笔记却分别记录卡在第三步、找到换脚方法、第三步做出来了。结果、笔记与时间记录共同提供复盘依据。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#24231f}.h{font-size:23px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#756f64}</style>
<rect width="1200" height="600" rx="24" fill="#f3f2ee"/>
<text x="45" y="61" style="font-size:31px;font-weight:800">“今天没爬上去”，不等于“今天没有进步”。</text>
<text x="45" y="101" class="s">同一条线路 · 三次尝试 · 用户语音笔记示例</text>
<path d="M210 187H990" stroke="#d2ccc0" stroke-width="5"/>
<g fill="#f7c600" stroke="#24231f" stroke-width="2"><circle cx="215" cy="187" r="16"/><circle cx="600" cy="187" r="16"/><circle cx="985" cy="187" r="16"/></g>
<g fill="#fff" stroke="#e2ddd3"><rect x="40" y="226" width="350" height="195" rx="18"/><rect x="425" y="226" width="350" height="195" rx="18"/><rect x="810" y="226" width="350" height="195" rx="18"/></g>
<text x="65" y="268" class="h">第 1 次 · 未完攀</text><text x="65" y="316" class="b">“卡在第三步，够不到。”</text><text x="65" y="369" class="s">留下问题，知道从哪里开始</text>
<text x="450" y="268" class="h">第 2 次 · 未完攀</text><text x="450" y="316" class="b">“先换左脚，好像更顺。”</text><text x="450" y="369" class="s">留下调整，记住尝试过的方法</text>
<text x="835" y="268" class="h">第 3 次 · 未完攀</text><text x="835" y="316" class="b">“第三步做出来了！”</text><text x="835" y="369" class="s">留下突破，下次接着往后练</text>
<rect x="40" y="458" width="1120" height="99" rx="17" fill="#fff0ae"/>
<text x="66" y="498" class="h">小搭复盘：“今天已经解开第三步，下次记得先换左脚。”</text>
<text x="66" y="532" class="s">按键记结果 + 语音记心得 + 时间与运动参考摘要 → 让复盘有据可循</text>
</svg>
